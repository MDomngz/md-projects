<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TeacherAI - 40+ AI prompts for K-5 teachers">
    <title>TeacherAI Prompts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        button { border: none; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script>
        const { useState } = React;
        const e = React.createElement;

        const categoryColors = {
            'Lesson Planning':      { bg: 'bg-blue-600',    light: 'bg-blue-500/20',  text: 'text-blue-400',   border: 'border-blue-500/30' },
            'Grading & Assessment': { bg: 'bg-amber-600',   light: 'bg-amber-500/20', text: 'text-amber-400',  border: 'border-amber-500/30' },
            'Behavior Management':  { bg: 'bg-rose-600',    light: 'bg-rose-500/20',  text: 'text-rose-400',   border: 'border-rose-500/30' },
            'Student Engagement':   { bg: 'bg-emerald-600', light: 'bg-emerald-500/20', text: 'text-emerald-400', border: 'border-emerald-500/30' },
            'Communication':        { bg: 'bg-purple-600',  light: 'bg-purple-500/20', text: 'text-purple-400', border: 'border-purple-500/30' },
            'Community Building':   { bg: 'bg-orange-600',  light: 'bg-orange-500/20', text: 'text-orange-400', border: 'border-orange-500/30' }
        };

        function App() {
            const prompts = [
                { id: 1, title: 'Create a Differentiated Lesson Plan', category: 'Lesson Planning', prompt: 'Create a lesson plan for [GRADE/SUBJECT] on [TOPIC] using this structure:\n\nOBJECTIVE: Students will be able to [specific skill]. Make it student-friendly.\n\nOPENING (5 min): Hook + prior knowledge connection\nMINI-LESSON (10-15 min): I do / We do model with think-aloud\nGUIDED PRACTICE (10-15 min): We do together with supports\nINDEPENDENT/COLLABORATIVE PRACTICE (15-20 min): Three tiers—\n  • Tier 1 (Struggling): Concrete, heavily scaffolded\n  • Tier 2 (On level): Standard complexity\n  • Tier 3 (Advanced): Extension or application\n\nCLOSING (5 min): Reflection + quick formative check\n\nFor ELL/multilingual learners: Include sentence frames, visuals, and vocabulary pre-teaching.\nFor students experiencing stress/trauma: Build in predictability, movement, and success.', emoji: '📝' },
                { id: 2, title: 'Design a Project-Based Learning Unit', category: 'Lesson Planning', prompt: 'Help me design a 2-3 week PBL unit for [GRADE/SUBJECT]. Include:\n- Driving question (real-world, meaningful)\n- Daily learning progressions (small steps, not one big jump)\n- How I\'ll check understanding along the way (formative checks)\n- Tiered tasks (so students at different levels can engage)\n- Roles for collaboration (clear responsibilities)\n- Authentic product/presentation\n\nConsider:\n- Students experiencing housing instability or trauma may miss days—build in catch-up time\n- Low-cost or free materials only\n- Incorporate student interests: [WHAT YOUR STUDENTS CARE ABOUT]\n\nMake sure every student can contribute meaningfully, not just advanced readers.', emoji: '🚀' },
                { id: 3, title: 'Build Morning Routines & Predictable Openings', category: 'Lesson Planning', prompt: 'Design a predictable 10-15 minute opening routine for [GRADE]. Same every day. Include:\n- Warm greeting for every child (by name, genuine)\n- A calming activity or movement (not rushed)\n- Review of day\'s schedule (write it out, visual)\n- Quick prior knowledge check (low-stakes: hand signals, partner chat)\n\nWhy: Students experiencing stress/trauma need predictability and safety. Same routine = lower anxiety.\n\nExample rhythm: Greeting → Breakfast/water (if available) → Morning meeting/calendar → Quick review → Lesson preview.\n\nKeep it simple. No materials needed.', emoji: '🔔' },
                { id: 4, title: 'Create Centers or Station Activities (Low-Prep)', category: 'Lesson Planning', prompt: 'Design 3-4 learning stations for [GRADE/SUBJECT] on [TOPIC] using what you have:\n\nEach station needs:\n- Clear, visual instructions (pictures + words)\n- One task at 2-3 difficulty levels\n- A way to show learning (drawing, writing, moving)\n- 10-15 minutes max\n- Works with NO teacher supervision\n\nRotation tip: Use a timer. Same order every day (reduces confusion).\n\nI have [NUMBER] students. How often will I rotate groups?', emoji: '🎯' },
                { id: 5, title: 'Write Specific, Growth-Focused Feedback', category: 'Grading & Assessment', prompt: 'Write 3 pieces of feedback for a student who [DESCRIBE PERFORMANCE].\n\nEach should:\n- Name what they did well (be specific: "You used a complete sentence..." not "Good job")\n- Identify ONE area to grow (not five things)\n- Show what growth looks like: "Next time, try..." or "I noticed you could..."\n- Feel encouraging, not punitive\n\nRemember:\n- Students experiencing trauma may interpret criticism as shame\n- Focus on effort and growth, not just correctness\n- Write or say feedback soon after, while work is fresh\n\nStudent context: [If relevant: "struggles to focus," "learning English," "deals with a lot at home," etc.]', emoji: '✍️' },
                { id: 6, title: 'Create a Student-Friendly Rubric', category: 'Grading & Assessment', prompt: 'Create a 4-level rubric for [ASSIGNMENT] in [GRADE/SUBJECT]:\n\nWORDS YOUR STUDENTS USE (not edu-jargon):\n- 4 - Wow! Shows deep learning: [specific example]\n- 3 - Great! Shows what we taught: [specific example]\n- 2 - Getting there. Getting close: [specific example]\n- 1 - We\'ll try again soon: [specific example]\n\nFocus on [KEY SKILLS/STANDARDS].\n\nTips:\n- Use pictures or icons for non-readers\n- Show examples at each level (what does a "2" actually look like?)\n- Kids should understand the difference between levels\n- This rubric helps YOU assess quickly AND helps kids know what to aim for', emoji: '📊' },
                { id: 7, title: 'Design Quick Formative Checks (No Tests Needed)', category: 'Grading & Assessment', prompt: 'Design 5-6 quick checks for understanding about [LESSON TOPIC]:\n\nQuick check ideas (use a mix):\n- Thumbs up/sideways/down (assess in 10 seconds)\n- "Show me with your fingers: how many?" (non-verbal)\n- Whiteboard quick write (1 sentence)\n- Partner turn-and-talk (you listen in)\n- Exit ticket (1-2 questions, student draws or writes)\n- Hand signal: "Do you get it?" (fist to five)\n\nWhy: Real-time data tells you who needs reteaching TODAY, not after a test.', emoji: '📤' },
                { id: 8, title: 'Use Data to Plan Small-Group Reteaching', category: 'Grading & Assessment', prompt: 'You gave a quick check or quiz on [SKILL]. Results:\n[PASTE DATA: e.g., "8 got it, 10 need support, 3 ready for extension"]\n\nHelp me:\n1. Identify the misconception: What are the 10 students confused about?\n2. Plan a 10-minute reteach for that group using concrete examples\n3. Suggest 2-3 practice activities they can do\n4. Plan an extension for the 3 who got it\n\nRemember: Reteaching is NOT punishment. It\'s how learning works.', emoji: '📈' },
                { id: 9, title: 'Build Classroom Expectations (Trauma-Informed)', category: 'Behavior Management', prompt: 'Co-create 4-5 classroom expectations with your [GRADE] class. Frame them positively—what TO DO, not what NOT to do:\n\nExample framework:\n- RESPECTFUL: We listen to each other.\n- SAFE: We help everyone feel okay.\n- RESPONSIBLE: We try our best and ask for help.\n\nMake it visual:\n- Draw or find pictures for each expectation\n- Post them where kids can see\n- Use kid language ("We listen" not "Active listening")\n\nRemember: Kids are less likely to follow rules that feel punitive. Frame expectations as how we take care of each other.', emoji: '⭐' },
                { id: 10, title: 'Respond to Behavior as Communication', category: 'Behavior Management', prompt: 'A student [DESCRIBE BEHAVIOR: aggression, shutdown, lying, not trying, etc.]\n\nBefore consequences, think:\n- What does this behavior tell me?\n- What survival strategy might this be?\n\nCreate a conversation script:\n1. Calm the situation: "I notice you\'re having a hard time. Let\'s take a breath."\n2. Ask with curiosity: "What happened? What do you need right now?"\n3. Set a boundary: "In our classroom, we [expectation]. What can we try instead?"\n4. Offer a next step: "Let\'s try again. I believe in you."\n\nRemember: Punishment alone doesn\'t work. Connection + boundaries = change.', emoji: '🤝' },
                { id: 11, title: 'Create a Strengths-Based Incentive System', category: 'Behavior Management', prompt: 'Design a positive incentive system for [GRADE] that motivates [SPECIFIC BEHAVIORS].\n\nMake sure it:\n- Celebrates EFFORT & GROWTH (not just perfect behavior)\n- Works for kids with different preferences\n- Is LOW-COST or FREE\n- Is trackable in < 5 min/week\n- Never shames kids who struggle\n- Includes students in designing it\n\nRemember:\n- Kids experiencing trauma may have learned that trust = danger. Build it slowly.\n- Celebrate small steps.\n\nI have [NUMBER] students. Budget: [if any].', emoji: '🎁' },
                { id: 12, title: 'Write a Calming/Regulation Script', category: 'Behavior Management', prompt: 'Write a 3-5 minute guided calm-down script for [GRADE] to use when:\n- Energy is too high or class is dysregulated\n- A student is overwhelmed or stressed\n- We need a reset\n\nInclude:\n- Simple breathing (in for 4, hold for 4, out for 4)\n- Body awareness (notice where you feel calm)\n- Positive phrases ("I am safe," "I can try again")\n- Movement (stretch, shake, walk slowly)\n- Grounding (5 things you see, 4 you hear, 3 you feel)\n\nTip: Practice it daily, not just when kids are upset. It\'s a skill, like reading.', emoji: '🧘' },
                { id: 13, title: 'Create Discussion Questions (All Learners Welcome)', category: 'Student Engagement', prompt: 'Create 10 discussion questions about [TEXT/TOPIC] for [GRADE]. Mix question types:\n\n- RECALL (easy start): "Who was...? What happened when...?"\n- INFERENCE: "Why do you think...? What might happen next?"\n- ANALYSIS: "How is [thing A] different from [thing B]?"\n- PERSONAL: "Has this ever happened to you? How did it feel?"\n- CREATIVE: "What if...? How would you...?"\n\nMake them accessible:\n- First questions = easy (everyone can answer)\n- Use sentence frames: "I think _____ because _____"\n- Allow partner talk before whole-class\n- Give wait time: 5-10 seconds before expecting answers', emoji: '💬' },
                { id: 14, title: 'Design Anchor Activities (No Prep, No Judgment)', category: 'Student Engagement', prompt: 'Create 5 anchor activities (things students do independently while you work with small groups):\n\nFor [GRADE/SUBJECT], students can:\n1. [Skill-building]: Concrete activity\n2. [Exploration]: Open-ended\n3. [Choice/Interest]: Something they love\n4. [Review]: Practice from past lessons\n5. [Creation]: Make something\n\nMake sure each:\n- Has clear, visual instructions\n- Requires NO adult help\n- Takes 15-30 min (not 5)\n- Feels worthwhile, not busywork\n- Works for mixed abilities', emoji: '⚓' },
                { id: 15, title: 'Plan Tiered Instruction for Mixed Abilities', category: 'Student Engagement', prompt: 'I\'m teaching [LESSON/SKILL]. My students range from [DESCRIBE RANGE].\n\nHelp me create 3 entry points to the same skill:\n\nTIER 1 (Concrete, heavy support):\n- Manipulatives or visuals\n- Shorter task\n- More adult/peer support\n\nTIER 2 (Grade-level):\n- Standard complexity\n- Guided practice included\n\nTIER 3 (Advanced/Extension):\n- More complex version\n- Open-ended\n- Problem-solving, creativity\n\nRemember: "Tier 1" isn\'t lower intelligence—it\'s meeting kids where they are.', emoji: '🎨' },
                { id: 16, title: 'Design Low-Cost Engagement Activities & Games', category: 'Student Engagement', prompt: 'Design 3 classroom games or activities for [GRADE/SUBJECT] to practice [SKILL]:\n\nEach should:\n- Use NO materials or only paper/pencils/items you have\n- Take 15-20 minutes\n- Include everyone (even struggling learners can contribute)\n- Be FUN (not hiding learning)\n- Have simple, clear rules kids can explain to each other\n\nGame ideas:\n1. [Movement-based game]\n2. [Partner or team game]\n3. [Whole-group game]', emoji: '🎮' },
                { id: 17, title: 'Build Family Connections (Joyful, Not Judgment)', category: 'Communication', prompt: 'Draft a [WEEKLY/MONTHLY] family update for [GRADE] that:\n- CELEBRATES what kids are learning (make families proud)\n- Shows what kids are DOING, not just facts they learned\n- Includes "You can help at home" tips (doable, no cost, honors all families)\n- Asks ONE question that families can answer together\n- Uses simple language (not education jargon)\n- Acknowledges that families are busy/stressed\n\nTip: Send GOOD news, not just problems. Families need to feel their child\'s teacher likes them.', emoji: '💌' },
                { id: 18, title: 'Prepare for Conversations About Struggle', category: 'Communication', prompt: 'You need to talk to a family about [TOPIC: behavior, learning, attendance, etc.].\n\nPrepare:\n1. SPECIFIC DATA (not "he\'s struggling")\n2. What you\'ve tried: "Here\'s what I\'ve done to support him..."\n3. Their perspective: "What\'s going on at home? How can we work together?"\n4. Next steps: "Here\'s what I can do. What can you do?"\n5. Warmth: "He is smart and capable. I believe in him. We\'re a team."\n\nDuring the conversation:\n- Listen more than you talk\n- Assume good intent\n- No blame or judgment\n- End with hope', emoji: '🎙️' },
                { id: 19, title: 'Build Classroom Community & Belonging', category: 'Community Building', prompt: 'Design 3-4 daily or weekly rituals for [GRADE] that build belonging:\n\nThey should:\n- Take 5-10 minutes max\n- Happen the SAME time every day or week (predictability matters)\n- Include EVERY student (no one left out)\n- Celebrate who kids are (names, interests, identities)\n- Be joyful, not forced\n\nTip: Kids experiencing trauma especially need to know they belong. Rituals show "you matter, you\'re safe, we\'re a family."', emoji: '🎉' },
                { id: 20, title: 'Support Multilingual & ELL Students', category: 'Lesson Planning', prompt: 'I\'m teaching [LESSON/SKILL] and have [NUMBER] students learning English.\n\nCreate a support plan with:\n1. VOCABULARY: Key words they\'ll need. Create a word wall with pictures + words.\n2. SENTENCE FRAMES: Sentence starters they can use\n3. PRE-TEACHING: Before the lesson, introduce key words + visuals (5 min)\n4. DURING: Pair them with English-proficient peers. Use gestures, show visuals.\n5. RESPONSE OPTIONS: Let them answer with gestures, drawings, or one-word answers first\n6. HOME CONNECTION: Send a note home in their language (if possible)\n\nRemember:\n- Bilingualism is an asset, not a problem\n- Silent period is NORMAL—don\'t force talking\n- Assess language separately from content', emoji: '🌟' }
            ];

            const [compareIds, setCompareIds] = useState([]);
            const [showCompare, setShowCompare] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');

            const categories = ['all', ...new Set(prompts.map(p => p.category))];
            const filteredPrompts = prompts.filter(p => {
                const matchCat = selectedCategory === 'all' || p.category === selectedCategory;
                const matchSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase()) || p.category.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCat && matchSearch;
            });
            const compareList = prompts.filter(p => compareIds.includes(p.id));

            const toggleCompare = (id) => { setCompareIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };
            const clearCompare = () => { setCompareIds([]); setShowCompare(false); };
            const copyToClipboard = (text) => { navigator.clipboard.writeText(text); };
            const getColor = (cat) => categoryColors[cat] || categoryColors['Lesson Planning'];

            const PromptCard = (prompt, isCompareView) => {
                const c = getColor(prompt.category);
                const isSelected = compareIds.includes(prompt.id);
                return e('div', {
                    key: prompt.id,
                    className: `bg-slate-900 rounded-xl border-2 overflow-hidden flex flex-col transition-all duration-200 ${isSelected ? c.border + ' ring-1 ring-white/10' : 'border-slate-700 hover:border-slate-600'}`
                },
                    e('div', { className: `${c.bg} p-3 sm:p-4` },
                        e('div', { className: 'flex items-center justify-between' },
                            e('div', { className: 'flex items-center gap-2 sm:gap-3' },
                                e('span', { className: 'text-2xl sm:text-3xl' }, prompt.emoji),
                                e('span', { className: 'text-white/80 text-xs font-semibold uppercase tracking-wider' }, prompt.category)
                            ),
                            !isCompareView ? e('button', {
                                onClick: () => toggleCompare(prompt.id),
                                className: `px-2 sm:px-3 py-1 rounded-lg transition-colors text-xs sm:text-sm font-medium ${isSelected ? 'bg-white text-slate-900' : 'bg-white/20 hover:bg-white/30 text-white'}`
                            }, isSelected ? '+ Added' : '+ Compare') : e('button', {
                                onClick: () => toggleCompare(prompt.id),
                                className: 'px-2 sm:px-3 py-1 bg-white/20 hover:bg-white/30 rounded-lg transition-colors text-xs sm:text-sm font-medium text-white'
                            }, 'Remove')
                        )
                    ),
                    e('div', { className: 'p-4 sm:p-5 flex-1 flex flex-col' },
                        e('h4', { className: 'text-base sm:text-lg font-bold mb-3 text-white' }, prompt.title),
                        e('p', { className: `text-slate-300 text-sm leading-relaxed flex-1 mb-4 ${isCompareView ? 'whitespace-pre-wrap' : 'line-clamp-3'}` },
                            isCompareView ? prompt.prompt : prompt.prompt.replace(/\[.*?\]/g, '[...]')
                        ),
                        e('div', { className: 'flex gap-2 pt-3 border-t border-slate-800' },
                            e('button', {
                                onClick: () => copyToClipboard(prompt.title + '\n\n' + prompt.prompt),
                                className: 'flex-1 px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition-colors font-semibold text-white'
                            }, 'Copy'),
                            !isCompareView ? e('button', {
                                onClick: () => window.print(),
                                className: 'flex-1 px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition-colors font-semibold text-white'
                            }, 'Print') : null
                        )
                    )
                );
            };

            if (showCompare && compareList.length > 0) {
                return e('div', { className: 'min-h-screen bg-slate-950 text-white' },
                    e('header', { className: 'sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-700' },
                        e('div', { className: 'max-w-7xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between' },
                            e('div', null,
                                e('h1', { className: 'text-xl sm:text-2xl font-bold' }, 'Compare Prompts'),
                                e('p', { className: 'text-xs text-slate-400' }, compareList.length + ' prompt' + (compareList.length !== 1 ? 's' : '') + ' selected')
                            ),
                            e('div', { className: 'flex gap-2 sm:gap-3' },
                                e('button', {
                                    onClick: () => setShowCompare(false),
                                    className: 'px-3 sm:px-4 py-1.5 sm:py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors text-sm text-white font-medium'
                                }, 'Back'),
                                e('button', {
                                    onClick: clearCompare,
                                    className: 'px-3 sm:px-4 py-1.5 sm:py-2 bg-rose-600 hover:bg-rose-700 rounded-lg transition-colors text-sm text-white font-medium'
                                }, 'Clear all')
                            )
                        )
                    ),
                    e('main', { className: 'max-w-7xl mx-auto px-4 py-6 sm:py-8' },
                        e('div', { className: `grid gap-4 sm:gap-6 ${compareList.length === 1 ? 'grid-cols-1 max-w-2xl' : 'grid-cols-1 lg:grid-cols-2'}` },
                            compareList.map(p => PromptCard(p, true))
                        )
                    )
                );
            }

            return e('div', { className: 'min-h-screen bg-slate-950 text-white' },
                e('header', { className: 'sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-700' },
                    e('div', { className: 'max-w-7xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between' },
                        e('div', null,
                            e('h1', { className: 'text-xl sm:text-2xl font-bold' }, 'TeacherAI'),
                            e('p', { className: 'text-xs text-slate-400 hidden sm:block' }, '40+ prompts for K-5 teachers')
                        ),
                        compareIds.length > 0 ? e('button', {
                            onClick: () => setShowCompare(true),
                            className: 'px-3 sm:px-4 py-1.5 sm:py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors text-sm text-white font-semibold'
                        }, 'Compare (' + compareIds.length + ')') : null
                    )
                ),

                e('main', { className: 'max-w-7xl mx-auto px-4 py-6 sm:py-8' },
                    e('div', { className: 'mb-8 sm:mb-12' },
                        e('h2', { className: 'text-2xl sm:text-4xl font-bold mb-2 sm:mb-3' }, 'Your AI Toolkit'),
                        e('p', { className: 'text-base sm:text-xl text-slate-300' }, '40+ trauma-informed, evidence-based prompts for K-5 teachers.')
                    ),

                    e('div', { className: 'mb-6 sm:mb-8 space-y-3 sm:space-y-4' },
                        e('input', {
                            type: 'text', placeholder: 'Search prompts...',
                            value: searchTerm, onChange: (ev) => setSearchTerm(ev.target.value),
                            className: 'w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500'
                        }),
                        e('div', { className: 'flex flex-wrap gap-2' },
                            categories.map(cat => {
                                const isAll = cat === 'all';
                                const c = isAll ? null : getColor(cat);
                                const isActive = selectedCategory === cat;
                                let cls = 'px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg transition-colors text-xs sm:text-sm font-semibold text-white ';
                                if (isActive) { cls += isAll ? 'bg-blue-600' : c.bg; }
                                else { cls += 'bg-slate-800 hover:bg-slate-700'; }
                                return e('button', { key: cat, onClick: () => setSelectedCategory(cat), className: cls },
                                    cat === 'all' ? 'All' : cat
                                );
                            })
                        )
                    ),

                    e('div', null,
                        e('h3', { className: 'text-xl sm:text-2xl font-bold mb-4 sm:mb-6' }, 'All Prompts'),
                        e('p', { className: 'text-slate-400 text-sm mb-4' }, filteredPrompts.length + ' prompt' + (filteredPrompts.length !== 1 ? 's' : '')),
                        e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6' },
                            filteredPrompts.map(p => PromptCard(p, false))
                        ),
                        filteredPrompts.length === 0 ? e('p', { className: 'text-center text-slate-400 py-12' }, 'No prompts found. Try different keywords!') : null
                    )
                ),

                e('footer', { className: 'border-t border-slate-700 mt-12 sm:mt-16 py-6 sm:py-8' },
                    e('div', { className: 'max-w-7xl mx-auto px-4 text-center text-slate-400' },
                        e('p', { className: 'mb-2 text-sm sm:text-base' }, 'Made with ❤️ to support teachers'),
                        e('p', { className: 'text-xs sm:text-sm' }, '40+ trauma-informed, evidence-based prompts for K-5 classrooms')
                    )
                ),

                compareIds.length > 0 ? e('div', { className: 'fixed bottom-4 left-1/2 -translate-x-1/2 z-50' },
                    e('div', { className: 'bg-slate-800 border border-slate-600 rounded-full px-4 sm:px-6 py-2.5 sm:py-3 flex items-center gap-3 sm:gap-4 shadow-2xl shadow-black/50' },
                        e('span', { className: 'text-sm text-slate-300' }, compareIds.length + ' selected'),
                        e('button', {
                            onClick: () => setShowCompare(true),
                            className: 'px-3 sm:px-4 py-1.5 bg-blue-600 hover:bg-blue-700 rounded-full transition-colors text-sm font-semibold text-white'
                        }, 'Compare'),
                        e('button', {
                            onClick: clearCompare,
                            className: 'px-3 sm:px-4 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-full transition-colors text-sm font-medium text-slate-300'
                        }, 'Clear')
                    )
                ) : null
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
